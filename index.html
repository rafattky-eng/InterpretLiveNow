<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InterpretLiveNow</title>
<meta name="description" content="Japanese ⇄ English live interpreter. Type, paste or speak, then hear the translation.">
<meta name="application-name" content="InterpretLiveNow">
<meta name="theme-color" content="#071B35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="InterpretLiveNow">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=1.0.2">
</head>
<body>
<header class="app-head">
  <div class="brand">
    <img src="icon-192.png" alt="InterpretLiveNow logo" width="52" height="52">
    <h1><span class="t1">Interpret</span><span class="t2">Live</span><span class="t3">Now</span></h1>
  </div>
  <div class="bar">
    <p id="stepLabel" class="step"></p>
    <div class="tools">
      <div class="ui-lang" role="group" aria-label="Interface language">
        <button type="button" data-ui="en" class="on">EN</button>
        <button type="button" data-ui="ja">JP</button>
      </div>
      <button type="button" id="btnReset" class="tool" aria-label="Reset" title="Reset">🔄</button>
      <button type="button" id="btnSave" class="tool" aria-label="Save" title="Save">💾</button>
    </div>
  </div>
</header>

<main>
  <div class="hero"><img src="logo-480.png" alt="InterpretLiveNow" width="132" height="132"></div>
  <div id="installCard" class="card install" hidden>
    <strong data-i18n="installTitle">Install on iPhone</strong>
    <p data-i18n="installBody">Tap Share, then “Add to Home Screen”.</p>
    <button type="button" id="installClose" class="ghost" data-i18n="gotIt">Got it</button>
  </div>

  <!-- TRANSLATE: steps 1 + 2 -->
  <section id="view-translate" class="view on">
    <div class="card">
      <h2><span class="badge">1</span> <span data-i18n="s1">Select language</span></h2>
      <div class="dir">
        <div class="pill from" id="fromPill">日本語</div>
        <button type="button" id="swap" class="swap" aria-label="Swap languages">⇄</button>
        <div class="pill to" id="toPill">English</div>
      </div>
      <div class="row sound">
        <button type="button" id="testSound" class="ghost" data-i18n="test">🔈 Test sound</button>
        <select id="rate" aria-label="Speech speed">
          <option value="0.7" data-i18n="slow">Slow</option>
          <option value="0.95" data-i18n="normal" selected>Normal</option>
          <option value="1.2" data-i18n="fast">Fast</option>
        </select>
        <label class="switch"><input type="checkbox" id="autoSpeak" checked> <span data-i18n="autoSpeak">Speak automatically</span></label>
      </div>
      <p id="soundMsg" class="status" role="status" aria-live="polite"></p>
    </div>

    <div class="card">
      <h2><span class="badge">2</span> <span data-i18n="s2">Type or paste text</span></h2>
      <textarea id="src" rows="5" autocapitalize="sentences" placeholder="Type a letter, number, word, question or paragraph…"></textarea>
      <div class="row">
        <button type="button" id="paste" class="ghost" data-i18n="paste">📋 Paste</button>
        <button type="button" id="clearSrc" class="ghost" data-i18n="clear">Clear</button>
        <label class="switch"><input type="checkbox" id="autoStop"> <span data-i18n="autoStop">Auto at full stop</span></label>
      </div>
      <button type="button" id="go" class="primary" data-i18n="go">🔊 Translate &amp; Speak</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div class="result" id="out" hidden>
        <div class="result-text" id="outText" lang="en"></div>
        <div class="row">
          <button type="button" id="speakOut" class="accent" data-i18n="speak">🔊 Speak</button>
          <button type="button" id="stopOut" class="ghost" data-i18n="stop">⏹ Stop</button>
          <button type="button" id="copyOut" class="ghost" data-i18n="copy">Copy</button>
        </div>
        <button type="button" id="toReply" class="link" data-i18n="toReply">Next: record the reply →</button>
      </div>
    </div>
  </section>

  <!-- REPLY: step 3 -->
  <section id="view-reply" class="view">
    <div class="card">
      <h2><span class="badge">3</span> <span id="replyTitle">Record the reply</span></h2>
      <p class="hint" id="replyHint"></p>
      <button type="button" id="rec" class="rec"><span class="recdot"></span><span id="recLabel">Record reply</span></button>
      <textarea id="reply" rows="4" placeholder="The reply appears here. You can also type, paste, or use the 🎤 key on the iPhone keyboard."></textarea>
      <div class="row">
        <button type="button" id="clearReply" class="ghost" data-i18n="clear">Clear</button>
        <button type="button" id="goReply" class="primary slim" data-i18n="translate">Translate</button>
      </div>
      <p id="status2" class="status" role="status" aria-live="polite"></p>
      <div class="result" id="out2" hidden>
        <div class="result-text" id="outText2"></div>
        <div class="row">
          <button type="button" id="speakOut2" class="accent" data-i18n="speak">🔊 Speak</button>
          <button type="button" id="stopOut2" class="ghost" data-i18n="stop">⏹ Stop</button>
          <button type="button" id="copyOut2" class="ghost" data-i18n="copy">Copy</button>
        </div>
      </div>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="view-history" class="view">
    <div class="card">
      <h2 data-i18n="history">History</h2>
      <ol id="hist" class="hist"></ol>
      <button type="button" id="clearHist" class="ghost" data-i18n="clearHist">Clear history</button>
    </div>
  </section>
</main>

<footer class="foot">
  <div>© 2026 Rafat Kotaki. All rights reserved.</div>
  <div>InterpretLiveNow · V1.0.2</div>
</footer>

<nav class="tabs" aria-label="Main">
  <button type="button" data-tab="translate" class="on"><span>🌐</span><em data-i18n="tabTranslate">Translate</em></button>
  <button type="button" data-tab="reply"><span>🎙</span><em data-i18n="tabReply">Reply</em></button>
  <button type="button" data-tab="history"><span>🕘</span><em data-i18n="tabHistory">History</em></button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=1.0.2"></script>
</body>
</html>
