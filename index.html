<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InterpretLive">
    <meta name="theme-color" content="#0a1128">
    <meta name="mobile-web-app-capable" content="yes">
    <title>InterpretLiveNow</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <img src="logo.png" alt="InterpretLiveNow Logo" class="app-logo">
            <h1>InterpretLiveNow</h1>
        </header>

        <!-- Step 1: Language Selection -->
        <section class="card">
            <h2>1. Select Languages</h2>
            <div class="lang-selector">
                <select id="sourceLang">
                    <option value="ja-JP">Japanese (日本語)</option>
                    <option value="en-US">English</option>
                </select>
                <button id="swapLangBtn" class="swap-btn" aria-label="Swap Languages">↔️</button>
                <select id="targetLang">
                    <option value="en-US">English</option>
                    <option value="ja-JP">Japanese (日本語)</option>
                </select>
            </div>
        </section>

        <!-- Step 2: Text Translation -->
        <section class="card">
            <h2>2. Type & Translate</h2>
            <textarea id="inputText" placeholder="Type or paste text here..." rows="4"></textarea>
            <div class="button-group">
                <button id="speakInputBtn" class="btn-secondary">🔊 Speak Input</button>
                <button id="translateBtn" class="btn-primary">Translate ➔</button>
            </div>
            
            <div id="outputContainer" class="output-box hidden">
                <p id="translatedText"></p>
                <button id="speakOutputBtn" class="btn-accent">🔊 Speak Translation</button>
            </div>
        </section>

        <!-- Step 3: Voice Reply -->
        <section class="card">
            <h2>3. Voice Reply</h2>
            <p class="instruction">Tap the mic, speak the reply, and it will auto-translate and speak.</p>
            <button id="recordBtn" class="btn-record">🎤 Tap to Record Reply</button>
            <div id="replyOutput" class="output-box hidden">
                <p id="replyText"></p>
                <button id="speakReplyBtn" class="btn-accent">🔊 Speak Reply</button>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 Rafat Kotaki. All rights reserved.</p>
            <p>InterpretLiveNow · V1.0.0</p>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered', reg.scope))
                    .catch(err => console.log('SW registration failed', err));
            });
        }
    </script>
</body>
</html>
